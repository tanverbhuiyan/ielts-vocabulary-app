<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Learn IELTS vocabulary with simple flashcards, Bangla meanings, and daily goals.">
  <title>Learn — IELTS Vocabulary</title>
  <link rel="stylesheet" href="static/css/style.css">
  
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="index.html" aria-label="IELTS Vocabulary home">
        <span class="logo-mark" aria-hidden="true">V</span>
        <span>IELTS Vocabulary</span>
      </a>
      <nav class="desktop-nav" aria-label="Main navigation">
        <a href="index.html" data-nav="index.html">Home</a>
        <a href="learn.html" data-nav="learn.html">Learn</a>
        <a href="words.html" data-nav="words.html">Words</a>
        <a href="review.html" data-nav="review.html">Review</a>
        <a href="progress.html" data-nav="progress.html">Progress</a>
      </nav>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch to dark mode"></button>
    </div>
  </header>

  <main class="container">
    
<div id="learn-main">
  <div id="learn-loading" class="loading"><div class="spinner"></div>Loading words…</div>

  <div class="learn-top">
    <a id="learn-back" class="back-link" href="index.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      Back
    </a>
    <h1 id="learn-title" class="learn-title">Vocabulary</h1>
    <span id="learn-counter" class="learn-counter" aria-live="polite">– / –</span>
  </div>

  <div class="progress-track" role="progressbar" aria-label="Learning progress">
    <div id="learn-progress-fill" class="progress-fill"></div>
  </div>

  <div id="flashcard" class="flashcard" tabindex="0" role="button" aria-label="Flashcard. Press Enter to reveal the meaning.">
    <div class="flashcard-inner">
      <div id="card-front" class="face face-front"></div>
      <div id="card-back" class="face face-back"></div>
    </div>
  </div>

  <div class="learn-controls">
    <div class="learn-nav">
      <button id="btn-prev" class="btn btn-ghost" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        Previous
      </button>
      <button id="btn-next" class="btn btn-ghost" type="button">
        Next
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
    <button id="btn-known" class="btn btn-success" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
      I Know This
    </button>
    <button id="btn-review" class="btn btn-warning" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg>
      Need Practice
    </button>
  </div>

  <p class="keyboard-hint">
    <kbd>Space</kbd> reveal &nbsp;·&nbsp; <kbd>←</kbd> <kbd>→</kbd> navigate &nbsp;·&nbsp; <kbd>K</kbd> known &nbsp;·&nbsp; <kbd>R</kbd> review
  </p>
</div>

  </main>

  <nav class="tabbar" aria-label="Main navigation">
    <a href="index.html" data-nav="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Home</span>
    </a>
    <a href="learn.html" data-nav="learn.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 9h18M8 21h8"/></svg>
      <span>Learn</span>
    </a>
    <a href="words.html" data-nav="words.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span>Words</span>
    </a>
    <a href="review.html" data-nav="review.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg>
      <span>Review</span>
    </a>
    <a href="progress.html" data-nav="progress.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg>
      <span>Progress</span>
    </a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="static/js/app.js"></script>
  <script src="static/js/store.js"></script>
  <script src="static/js/data.js"></script>
  
<script src="static/js/flashcard.js"></script>

</body>
</html>
